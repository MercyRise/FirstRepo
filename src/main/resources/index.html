<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trip Itinerary Builder</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="hero">
        <p class="eyebrow">Trip Planner</p>
        <h1>Create your itinerary</h1>
        <p class="subhead">
          Pick a destination, choose your travel dates, and add activities with
          location, price, and notes.
        </p>
      </header>

      <section class="card">
        <h2>Trip basics</h2>
        <div class="grid">
          <label class="field">
            <span>Destination city</span>
            <input type="text" id="destination" placeholder="Paris" />
          </label>
          <label class="field">
            <span>Departure date</span>
            <input type="date" id="departure" />
          </label>
          <label class="field">
            <span>Return date</span>
            <input type="date" id="return" />
          </label>
        </div>
        <p class="hint" id="date-hint"></p>
      </section>

      <section class="card">
        <div class="card-header">
          <h2>Add an activity</h2>
          <p class="subhead">Add each stop with an address, price, and notes.</p>
        </div>
        <div class="grid">
          <label class="field">
            <span>Date</span>
            <input type="date" id="activity-date" />
          </label>
          <label class="field">
            <span>Place or activity</span>
            <input type="text" id="activity-place" placeholder="Louvre Museum" />
          </label>
          <label class="field">
            <span>Address</span>
            <input type="text" id="activity-address" placeholder="Rue de Rivoli" />
          </label>
          <label class="field">
            <span>Price</span>
            <input type="number" id="activity-price" placeholder="35.00" min="0" step="0.01" />
          </label>
          <label class="field field-wide">
            <span>Notes</span>
            <textarea id="activity-notes" rows="2" placeholder="Timed tickets at 10am"></textarea>
          </label>
        </div>
        <div class="actions">
          <button type="button" id="add-activity">Add activity</button>
          <span class="hint" id="activity-hint"></span>
        </div>
      </section>

      <section class="card">
        <h2>Itinerary preview</h2>
        <div class="summary" id="trip-summary">
          <div>
            <p class="summary-label">Destination</p>
            <p id="summary-destination">Not set yet</p>
          </div>
          <div>
            <p class="summary-label">Travel dates</p>
            <p id="summary-dates">Not set yet</p>
          </div>
        </div>
        <ul class="activity-list" id="activity-list"></ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
